{% extends "base.html" %}
{% block content %}
<h2 class="mb-4">Create New Exam</h2>
<div class="card shadow-sm mb-4">
    <div class="card-body">
        <form id="examForm">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label>Title</label>
                    <input type="text" id="title" class="form-control" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label>Subject</label>
                    <select id="subject" class="form-select" required>
                        <option value="">Select Subject...</option>
                        {% for subject in subjects %}
                            <option value="{{ subject }}">{{ subject }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-2 mb-3">
                    <label>Time (mins)</label>
                    <input type="number" id="time_limit_mins" class="form-control" value="30" required>
                </div>
            </div>
            
            <h5 class="mt-4">Questions</h5>
            <div id="questionsContainer"></div>
            <button type="button" class="btn btn-secondary mt-2 mb-4" onclick="addQuestion()">+ Add Question</button>
            
            <h5 class="mt-4">Allot Students</h5>
            <div class="d-flex gap-2 mb-2">
                <input type="text" class="form-control" id="studentSearchInput" placeholder="Search by roll no or name..." autocomplete="off">
                <select class="form-select" id="departmentFilter" style="max-width: 200px;">
                    <option value="">All Depts</option>
                    {% for dept in departments %}
                    <option value="{{ dept|lower }}">{{ dept }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="d-flex justify-content-between align-items-center mb-2">
                <button type="button" class="btn btn-sm btn-outline-primary" id="selectAllBtn">
                    <i class="bi bi-check2-all"></i> Select All
                </button>
                <span class="text-muted small"><span id="selectedCount">0</span> student(s) selected</span>
            </div>
            <div id="studentPickerList" class="mb-3" style="max-height: 200px; overflow-y: auto; border: 1px solid #dee2e6; border-radius: .375rem; padding: 0;">
                {% for s in students %}
                <label class="student-pick-item d-flex align-items-center px-3 py-2 border-bottom"
                       style="cursor:pointer; margin:0;"
                       data-roll="{{ s.roll_no|lower }}"
                       data-name="{{ s.name|lower }}"
                       data-dept="{{ s.department|lower }}">
                    <input type="checkbox" class="form-check-input me-2 student-checkbox" value="{{ s.id }}">
                    <span class="fw-semibold me-2">{{ s.roll_no }}</span>
                    <span class="text-muted">{{ s.name }}</span>
                    <span class="badge bg-light text-secondary ms-auto">{{ s.department }}</span>
                </label>
                {% endfor %}
            </div>
            
            <button type="button" class="btn btn-primary btn-lg w-100" onclick="submitExam()">Create Exam</button>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let questionCount = 0;

function addQuestion() {
    questionCount++;
    const qId = `q_${questionCount}`;
    const html = `
        <div class="card mb-3" id="${qId}">
            <div class="card-body">
                <div class="d-flex justify-content-between mb-2">
                    <h6>Question ${questionCount}</h6>
                    <button type="button" class="btn btn-sm btn-danger" onclick="document.getElementById('${qId}').remove()">Remove</button>
                </div>
                <textarea class="form-control mb-2 q-text" placeholder="Enter question text here..." required></textarea>
                <div class="row mb-2">
                    <div class="col-6">
                        <label>Marks Awarded</label>
                        <input type="number" step="0.1" class="form-control q-awarded" value="1.0" required>
                    </div>
                    <div class="col-6">
                        <label>Marks Deducted (if wrong)</label>
                        <input type="number" step="0.1" class="form-control q-deducted" value="0.0" required>
                    </div>
                </div>
                <h6 class="mt-3">Options</h6>
                <div class="options-container"></div>
                <button type="button" class="btn btn-sm btn-outline-secondary mt-2" onclick="addOption('${qId}')">+ Add Option</button>
            </div>
        </div>
    `;
    document.getElementById('questionsContainer').insertAdjacentHTML('beforeend', html);
    addOption(qId);
    addOption(qId);
}

function addOption(qId) {
    const optsContainer = document.querySelector(`#${qId} .options-container`);
    const html = `
        <div class="input-group mb-2 option-row">
            <div class="input-group-text">
                <input class="form-check-input mt-0 o-correct" type="checkbox" aria-label="Checkbox for correct option" title="Mark if correct">
            </div>
            <input type="text" class="form-control o-text" placeholder="Option text..." required>
            <button class="btn btn-outline-danger" type="button" onclick="this.parentElement.remove()">X</button>
        </div>
    `;
    optsContainer.insertAdjacentHTML('beforeend', html);
}

function submitExam() {
    const data = {
        title: document.getElementById('title').value,
        subject: document.getElementById('subject').value,
        time_limit_mins: document.getElementById('time_limit_mins').value,
        questions: [],
        allotted_students: []
    };
    
    document.querySelectorAll('#questionsContainer .card').forEach(qCard => {
        const q = {
            text: qCard.querySelector('.q-text').value,
            marks_awarded: qCard.querySelector('.q-awarded').value,
            marks_deducted: qCard.querySelector('.q-deducted').value,
            options: []
        };
        qCard.querySelectorAll('.option-row').forEach(oRow => {
            q.options.push({
                text: oRow.querySelector('.o-text').value,
                is_correct: oRow.querySelector('.o-correct').checked
            });
        });
        data.questions.push(q);
    });
    
    document.querySelectorAll('.student-checkbox:checked').forEach(cb => {
        data.allotted_students.push(cb.value);
    });
    
    fetch('{{ url_for("main.create_exam") }}', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
    }).then(r => r.json()).then(res => {
        if(res.success) {
            window.location.href = res.redirect;
        } else {
            alert('Failed to create exam');
        }
    });
}

// Add 1 initial question and setup student filter/picker logic
document.addEventListener('DOMContentLoaded', () => {
    addQuestion();

    const searchInput = document.getElementById('studentSearchInput');
    const deptFilter = document.getElementById('departmentFilter');
    const selectAllBtn = document.getElementById('selectAllBtn');
    const checkboxes = document.querySelectorAll('.student-checkbox');
    const items = document.querySelectorAll('.student-pick-item');
    const selectedCountEl = document.getElementById('selectedCount');

    function isVisible(item) {
        return !item.classList.contains('d-none');
    }

    function applyFilters() {
        const q = searchInput.value.trim().toLowerCase();
        const dept = deptFilter.value;

        items.forEach(function(item) {
            const roll = item.getAttribute('data-roll');
            const name = item.getAttribute('data-name');
            const itemDept = item.getAttribute('data-dept');

            const matchesSearch = !q || roll.includes(q) || name.includes(q);
            const matchesDept = !dept || itemDept === dept;

            if (matchesSearch && matchesDept) {
                item.classList.remove('d-none');
            } else {
                item.classList.add('d-none');
            }
        });

        updateSelectAllBtnLabel();
    }

    searchInput.addEventListener('input', applyFilters);
    deptFilter.addEventListener('change', applyFilters);

    selectAllBtn.addEventListener('click', function() {
        const visibleCheckboxes = [];
        items.forEach(function(item) {
            if (isVisible(item)) {
                visibleCheckboxes.push(item.querySelector('.student-checkbox'));
            }
        });

        const allChecked = visibleCheckboxes.length > 0 &&
            visibleCheckboxes.every(function(cb) { return cb.checked; });

        visibleCheckboxes.forEach(function(cb) {
            cb.checked = !allChecked;
        });

        updateSelectedCount();
    });

    function updateSelectAllBtnLabel() {
        const visibleCheckboxes = [];
        items.forEach(function(item) {
            if (isVisible(item)) {
                visibleCheckboxes.push(item.querySelector('.student-checkbox'));
            }
        });

        const allChecked = visibleCheckboxes.length > 0 &&
            visibleCheckboxes.every(function(cb) { return cb.checked; });

        if (allChecked) {
            selectAllBtn.innerHTML = '<i class="bi bi-x-square"></i> Deselect All';
        } else {
            selectAllBtn.innerHTML = '<i class="bi bi-check2-all"></i> Select All';
        }
    }

    checkboxes.forEach(function(cb) {
        cb.addEventListener('change', updateSelectedCount);
    });

    function updateSelectedCount() {
        let count = 0;
        checkboxes.forEach(function(cb) {
            if (cb.checked) count++;
        });
        selectedCountEl.textContent = count;
        updateSelectAllBtnLabel();
    }
});
</script>
{% endblock %}
