{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h2 class="mb-4 text-dark fw-bold">Create New Exam</h2>
    <div class="card shadow-sm border-0 mb-5 p-4 bg-white" style="border-radius: 12px;">
        <form id="examForm">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-medium text-dark">Title</label>
                    <input type="text" id="title" class="form-control login-input" placeholder="e.g. Mid-Semester Exam I" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label fw-medium text-dark">Subject</label>
                    <select id="subject" class="form-select login-input" required>
                        <option value="">Select Subject...</option>
                        {% for subject in subjects %}
                            <option value="{{ subject }}">{{ subject }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-2 mb-3">
                    <label class="form-label fw-medium text-dark">Time (mins)</label>
                    <input type="number" id="time_limit_mins" class="form-control login-input" value="30" required>
                </div>
            </div>
            
            <h5 class="mt-4 mb-3 text-dark fw-semibold">Questions</h5>
            <div id="questionsContainer"></div>
            <button type="button" class="btn btn-navy-outline mt-2 mb-5 px-4 py-2" onclick="addQuestion()"><i class="bi bi-plus-lg me-1"></i> Add Question</button>
            
            <h5 class="mt-4 mb-3 text-dark fw-semibold">Allot Students</h5>
            <div class="d-flex gap-3 mb-3">
                <input type="text" class="form-control login-input" id="studentSearchInput" placeholder="Search by roll no or name..." autocomplete="off">
                <select class="form-select login-input" id="departmentFilter" style="max-width: 200px;">
                    <option value="">All Depts</option>
                    {% for dept in departments %}
                    <option value="{{ dept|lower }}">{{ dept }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="d-flex justify-content-between align-items-center mb-3">
                <button type="button" class="btn btn-sm btn-select-all-outline" id="selectAllBtn">
                    <i class="bi bi-check2-all"></i> Select All
                </button>
                <span class="text-muted small"><span id="selectedCount" class="fw-semibold text-dark">0</span> of <span class="fw-semibold text-dark">{{ students|length }}</span> student(s) selected</span>
            </div>
            <div id="studentPickerList" class="mb-4" style="max-height: 250px; overflow-y: auto; border: 1px solid var(--color-border); border-radius: 8px; padding: 0; background: #fff;">
                {% for s in students %}
                <label class="student-pick-item d-flex align-items-center px-3 py-2 border-bottom"
                       style="cursor:pointer; margin:0;"
                       data-roll="{{ s.roll_no|lower }}"
                       data-name="{{ s.name|lower }}"
                       data-dept="{{ s.department|lower }}">
                    <input type="checkbox" class="custom-checkbox-ember me-3 student-checkbox" value="{{ s.id }}">
                    <span class="fw-semibold me-3 text-dark" style="font-family: 'JetBrains Mono', monospace; min-width: 70px;">{{ s.roll_no }}</span>
                    <span class="text-secondary">{{ s.name }}</span>
                    <span class="badge bg-light text-secondary ms-auto" style="border: 1px solid var(--color-border);">{{ s.department }}</span>
                </label>
                {% endfor %}
            </div>
            
            <button type="button" class="btn-submit-exam w-100" onclick="submitExam()">Create Exam</button>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let questionCount = 0;

function autoResizeTextarea(el) {
    el.style.height = 'auto';
    el.style.height = el.scrollHeight + 'px';
}

function addQuestion() {
    questionCount++;
    const qId = `q_${questionCount}`;
    const html = `
        <div class="question-card-edit mb-4" id="${qId}">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div class="d-flex align-items-center gap-2">
                    <span class="question-number-badge">${questionCount}</span>
                    <h6 class="mb-0 fw-semibold text-dark">Question</h6>
                </div>
                <div class="remove-q-btn">
                    <button type="button" class="btn btn-sm btn-outline-danger" onclick="document.getElementById('${qId}').remove(); renumberQuestions();">Remove</button>
                </div>
            </div>
            <textarea class="form-control mb-3 q-textarea q-text" placeholder="Enter question text here..." oninput="autoResizeTextarea(this)" required></textarea>
            
            <div class="row mb-3">
                <div class="col-md-6 mb-2 mb-md-0">
                    <label class="form-label text-muted small fw-semibold">Marks Awarded</label>
                    <div class="pill-input-group pill-input-awarded">
                        <i class="bi bi-plus-circle-fill text-success me-2"></i>
                        <input type="number" step="0.1" class="q-awarded" value="1.0" required>
                    </div>
                </div>
                <div class="col-md-6">
                    <label class="form-label text-muted small fw-semibold">Marks Deducted (if wrong)</label>
                    <div class="pill-input-group pill-input-deducted">
                        <i class="bi bi-dash-circle-fill text-danger me-2"></i>
                        <input type="number" step="0.1" class="q-deducted" value="0.0" required>
                    </div>
                </div>
            </div>
            
            <h6 class="mt-4 text-dark fw-semibold small">Options</h6>
            <div class="options-container"></div>
            <button type="button" class="btn btn-sm btn-add-option mt-2" onclick="addOption('${qId}')">+ Add Option</button>
        </div>
    `;
    document.getElementById('questionsContainer').insertAdjacentHTML('beforeend', html);
    addOption(qId);
    addOption(qId);
    renumberQuestions();
}

function addOption(qId) {
    const optsContainer = document.querySelector(`#${qId} .options-container`);
    const html = `
        <div class="d-flex mb-2 option-row align-items-center">
            <div class="me-3 d-flex align-items-center">
                <input class="custom-checkbox-ember o-correct" type="checkbox" title="Mark if correct">
            </div>
            <input type="text" class="form-control o-text login-input" placeholder="Option text..." required style="height: 40px; font-size: 14px;">
            <button class="btn btn-outline-danger ms-2" type="button" onclick="this.parentElement.remove()" style="height: 40px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; width: 40px;"><i class="bi bi-trash"></i></button>
        </div>
    `;
    optsContainer.insertAdjacentHTML('beforeend', html);
}

function renumberQuestions() {
    let count = 0;
    document.querySelectorAll('#questionsContainer .question-card-edit').forEach(qCard => {
        count++;
        qCard.querySelector('.question-number-badge').textContent = count;
    });
}

function submitExam() {
    const titleVal = document.getElementById('title').value;
    const subjVal = document.getElementById('subject').value;
    const timeVal = document.getElementById('time_limit_mins').value;
    
    if(!titleVal || !subjVal || !timeVal) {
        alert('Please fill out Title, Subject and Time Limit.');
        return;
    }
    
    const data = {
        title: titleVal,
        subject: subjVal,
        time_limit_mins: timeVal,
        questions: [],
        allotted_students: []
    };
    
    const questionCards = document.querySelectorAll('#questionsContainer .question-card-edit');
    if(questionCards.length === 0) {
        alert('Please add at least one question.');
        return;
    }
    
    let valid = true;
    questionCards.forEach(qCard => {
        const textVal = qCard.querySelector('.q-text').value;
        const awardedVal = qCard.querySelector('.q-awarded').value;
        const deductedVal = qCard.querySelector('.q-deducted').value;
        
        if(!textVal) {
            valid = false;
            return;
        }
        
        const q = {
            text: textVal,
            marks_awarded: awardedVal,
            marks_deducted: deductedVal,
            options: []
        };
        
        const optionRows = qCard.querySelectorAll('.option-row');
        if(optionRows.length < 2) {
            alert('Each question must have at least 2 options.');
            valid = false;
            return;
        }
        
        optionRows.forEach(oRow => {
            const oTextVal = oRow.querySelector('.o-text').value;
            if(!oTextVal) {
                valid = false;
                return;
            }
            q.options.push({
                text: oTextVal,
                is_correct: oRow.querySelector('.o-correct').checked
            });
        });
        data.questions.push(q);
    });
    
    if(!valid) {
        alert('Please fill in all question text and option fields.');
        return;
    }
    
    document.querySelectorAll('.student-checkbox:checked').forEach(cb => {
        data.allotted_students.push(cb.value);
    });
    
    fetch('{{ url_for("main.create_exam") }}', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
    }).then(r => r.json()).then(res => {
        if(res.success) {
            window.location.href = res.redirect;
        } else {
            alert('Failed to create exam');
        }
    });
}

// Add 1 initial question and setup student filter/picker logic
document.addEventListener('DOMContentLoaded', () => {
    addQuestion();

    const searchInput = document.getElementById('studentSearchInput');
    const deptFilter = document.getElementById('departmentFilter');
    const selectAllBtn = document.getElementById('selectAllBtn');
    const checkboxes = document.querySelectorAll('.student-checkbox');
    const items = document.querySelectorAll('.student-pick-item');
    const selectedCountEl = document.getElementById('selectedCount');

    function isVisible(item) {
        return !item.classList.contains('d-none');
    }

    function applyFilters() {
        const q = searchInput.value.trim().toLowerCase();
        const dept = deptFilter.value;

        items.forEach(function(item) {
            const roll = item.getAttribute('data-roll');
            const name = item.getAttribute('data-name');
            const itemDept = item.getAttribute('data-dept');

            const matchesSearch = !q || roll.includes(q) || name.includes(q);
            const matchesDept = !dept || itemDept === dept;

            if (matchesSearch && matchesDept) {
                item.classList.remove('d-none');
            } else {
                item.classList.add('d-none');
            }
        });

        updateSelectAllBtnLabel();
    }

    searchInput.addEventListener('input', applyFilters);
    deptFilter.addEventListener('change', applyFilters);

    selectAllBtn.addEventListener('click', function() {
        const visibleCheckboxes = [];
        items.forEach(function(item) {
            if (isVisible(item)) {
                visibleCheckboxes.push(item.querySelector('.student-checkbox'));
            }
        });

        const allChecked = visibleCheckboxes.length > 0 &&
            visibleCheckboxes.every(function(cb) { return cb.checked; });

        visibleCheckboxes.forEach(function(cb) {
            cb.checked = !allChecked;
        });

        updateSelectedCount();
    });

    function updateSelectAllBtnLabel() {
        const visibleCheckboxes = [];
        items.forEach(function(item) {
            if (isVisible(item)) {
                visibleCheckboxes.push(item.querySelector('.student-checkbox'));
            }
        });

        const allChecked = visibleCheckboxes.length > 0 &&
            visibleCheckboxes.every(function(cb) { return cb.checked; });

        if (allChecked) {
            selectAllBtn.innerHTML = '<i class="bi bi-x-square"></i> Deselect All';
            selectAllBtn.className = "btn btn-sm btn-select-all-solid";
        } else {
            selectAllBtn.innerHTML = '<i class="bi bi-check2-all"></i> Select All';
            selectAllBtn.className = "btn btn-sm btn-select-all-outline";
        }
    }

    checkboxes.forEach(function(cb) {
        cb.addEventListener('change', updateSelectedCount);
    });

    function updateSelectedCount() {
        let count = 0;
        checkboxes.forEach(function(cb) {
            if (cb.checked) count++;
        });
        selectedCountEl.textContent = count;
        updateSelectAllBtnLabel();
    }
});
</script>
{% endblock %}
