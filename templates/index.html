{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <h3 class="text-center mb-4">Student Login</h3>
        <div class="card shadow-sm mb-4">
            <div class="card-body p-4">
                <form action="{{ url_for('main.login_student') }}" method="POST">
                    <div class="mb-3">
                        <label>Name</label>
                        <input type="text" name="name" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>Roll No</label>
                        <input type="text" name="roll_no" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>Department</label>
                        <select name="department" class="form-select" required>
                            <option value="">Select Dept...</option>
                            <option value="CSE">CSE</option>
                            <option value="ECE">ECE</option>
                            <option value="EE">EE</option>
                            <option value="ME">ME</option>
                            <option value="CE">CE</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label>Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Login as Student</button>
                </form>
            </div>
        </div>
    </div>
    
    <div class="col-md-5">
        <h3 class="text-center mb-4">Faculty Login</h3>
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <form action="{{ url_for('main.login_faculty') }}" method="POST">
                    <div class="mb-3">
                        <label>Email</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-dark w-100">Login as Faculty</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
